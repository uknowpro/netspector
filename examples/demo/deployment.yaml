apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather
spec:
  selector:
    matchLabels: {app: weather}
  template:
    metadata:
      labels: {app: weather}
    spec:
      containers:
        - name: api
          image: example/weather:demo
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: NOTIFY_URL
              value: https://notify.example.com/events
---
apiVersion: v1
kind: Service
metadata:
  name: weather
spec:
  selector: {app: weather}
  ports:
    - name: web
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: weather-public
spec:
  rules:
    - host: weather.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: weather
                port:
                  name: web

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netspector"
version = "0.1.0"
description = "Evidence-backed inbound and outbound network discovery from source and configuration."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "uknow"}]
dependencies = ["PyYAML>=6.0,<7"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/uknowpro/netspector"
Issues = "https://github.com/uknowpro/netspector/issues"
Releases = "https://github.com/uknowpro/netspector/releases"

[project.scripts]
netspector = "netspector.cli:main"

[tool.setuptools.packages.find]
include = ["netspector*"]

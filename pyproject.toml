[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netspector"
version = "0.1.0"
description = "Evidence-backed inbound and outbound network discovery from source and configuration."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "uknow"}]
dependencies = ["PyYAML>=6.0,<7"]

[project.scripts]
netspector = "netspector.cli:main"

[tool.setuptools.packages.find]
include = ["netspector*"]

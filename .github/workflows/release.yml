name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  binary:
    name: Binary (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x86_64
            architecture: x64
          - os: macos-15-intel
            target: macos-x86_64
            architecture: x64
          - os: macos-15
            target: macos-arm64
            architecture: arm64
          - os: windows-2022
            target: windows-x86_64
            architecture: x64
          - os: windows-2022
            target: windows-x86
            architecture: x86
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: ${{ matrix.architecture }}
      - name: Install build dependencies
        run: python -m pip install . 'pyinstaller==6.16.0'
      - name: Verify build architecture
        env:
          TARGET: ${{ matrix.target }}
        run: python -c 'import os, platform, struct; from scripts.release_support import validate_runtime; validate_runtime(os.environ["TARGET"], platform.system(), platform.machine(), struct.calcsize("P") * 8)'
      - name: Verify version and tests
        run: |
          python -c 'import os, tomllib; from netspector import __version__; assert os.environ["GITHUB_REF_NAME"] == "v" + __version__; assert tomllib.load(open("pyproject.toml", "rb"))["project"]["version"] == __version__'
          python -m unittest discover -s tests -v
      - name: Build standalone executable
        run: python -m PyInstaller --noconfirm --clean --onefile --noupx --name netspector --paths . --specpath build scripts/entrypoint.py
      - name: Package and test shipped archive
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python scripts/package_binary.py "$TARGET"
          python scripts/smoke_binary.py release-assets/* "${GITHUB_REF_NAME#v}" "$TARGET"
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error
  python-package:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Test wheel installation outside checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-test"
          "$RUNNER_TEMP/wheel-test/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-test/bin/netspector" --version
          "$RUNNER_TEMP/wheel-test/bin/netspector" scan "$GITHUB_WORKSPACE/examples/demo" --format json
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*
          if-no-files-found: error
  draft:
    needs: [binary, python-package]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS
      - name: Create draft release with verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --draft --title "netspector $GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md"

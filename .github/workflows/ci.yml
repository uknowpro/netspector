name: CI
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-2022]
        python: ['3.11', '3.12', '3.13']
        architecture: [native]
        include:
          - os: windows-2022
            python: '3.11'
            architecture: x86
          - os: windows-2022
            python: '3.12'
            architecture: x86
          - os: windows-2022
            python: '3.13'
            architecture: x86
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.architecture == 'native' && (matrix.os == 'macos-15' && 'arm64' || 'x64') || matrix.architecture }}
      - name: Verify x86 interpreter
        if: matrix.architecture == 'x86'
        run: python -c "import struct; assert struct.calcsize('P') == 4"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: netspector scan examples/demo --format json
      - run: netspector scan examples/demo --format html --output report.html
      - run: netspector scan examples/java --format json
      - run: netspector scan examples/java --format html --output java-report.html
